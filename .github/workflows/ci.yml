name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── 单元测试 ───
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run

  # ─── E2E 测试 ───
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 构建各物料库并拷贝到 vue3-host/public/widgets/
      - name: Build vue3-widget-lib
        working-directory: demo/vue3-widget-lib
        run: pnpm build:all

      - name: Build h5-widget-lib
        working-directory: demo/h5-widget-lib
        run: pnpm build:all

      - name: Copy widget assets to vue3-host
        run: |
          mkdir -p demo/vue3-host/public/widgets
          cp demo/vue3-widget-lib/dist/*.js demo/vue3-host/public/widgets/ 2>/dev/null || true
          cp demo/vue3-widget-lib/dist/*.css demo/vue3-host/public/widgets/ 2>/dev/null || true
          cp demo/h5-widget-lib/dist/*.js demo/vue3-host/public/widgets/ 2>/dev/null || true
          cp demo/h5-widget-lib/dist/*.css demo/vue3-host/public/widgets/ 2>/dev/null || true

      # 构建并启动 vue3-host 预览服务
      - name: Build vue3-host
        working-directory: demo/vue3-host
        run: pnpm build

      - name: Start vue3-host preview
        working-directory: demo/vue3-host
        run: npx vite preview --port 4173 --strictHost &

      - name: Wait for server
        run: npx wait-on http://localhost:4173 --timeout 30000

      # 安装 Playwright 浏览器并运行 E2E
      - run: pnpm e2e:install
      - name: Run Playwright tests
        run: pnpm e2e
        env:
          E2E_BASE_URL: http://localhost:4173

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
