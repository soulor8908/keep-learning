<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue3 基座</title>
  <!-- Vue3 基座自身通过 Vite 引入 Vue3，这里额外加载 Vue2 运行时供 Vue2 物料使用。
       Vue2 运行时已本地化为 /vendor/vue@2.js（来源 vue2-widget-lib node_modules），离线/内网环境可用。 -->
  <script src="/vendor/vue@2.js"></script>
  <script>window.Vue2 = window.Vue;</script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
