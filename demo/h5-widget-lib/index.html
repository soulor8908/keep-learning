<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H5 物料 Demo 预览</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 24px;
    }
    h1 { font-size: 20px; color: #1f2937; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .note {
      margin-top: 24px;
      padding: 12px 16px;
      background: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 6px;
      font-size: 13px;
      color: #614700;
    }
  </style>
</head>
<body>
  <h1>H5 原生物料 Demo</h1>
  <p>以下物料由 h5-vite-plugin 自动包装为 Custom Element，无框架依赖。</p>

  <div class="grid">
    <!-- 时钟卡片：扁平化 props（render + onMount + onUnmount + onPropsChange） -->
    <bi-clock-card
      label="北京时间"
      timezone="Asia/Shanghai"
    ></bi-clock-card>

    <!-- 公告板：纯函数模式（仅 render） -->
    <bi-notice-board
      title="系统公告"
      items='[{"text":"系统将于今晚 22:00 维护","level":"warning"},{"text":"新版本已发布","level":"info"}]'
    ></bi-notice-board>
  </div>

  <div class="note">
    本页面需先构建物料（npm run build:all），再将 dist 下的 JS/CSS 引入此页面。
    基座环境下由 widget-loader 自动加载，此处仅作本地预览。
  </div>

  <!-- 构建产物引入示例（需先 npm run build:all） -->
  <!-- <link rel="stylesheet" href="./dist/bi-clock-card.css" /> -->
  <!-- <link rel="stylesheet" href="./dist/bi-notice-board.css" /> -->
  <!-- <script src="./dist/bi-clock-card.js"></script> -->
  <!-- <script src="./dist/bi-notice-board.js"></script> -->
</body>
</html>
