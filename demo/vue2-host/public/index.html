<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue2 基座</title>
  <!-- 双 Vue 运行时：基座自身用 Vue2（webpack 打包并挂到 window.Vue2），
       额外通过 CDN 加载 Vue3 挂到 window.Vue3，供 Vue3 物料使用。
       先加载 Vue3 再由 webpack 注入 Vue2，互不冲突（Vue2 走模块 import，不依赖 window.Vue）。 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>window.Vue3 = window.Vue;</script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
