<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue2 基座</title>
  <!-- 双 Vue 运行时：基座自身用 Vue2（webpack 打包并挂到 window.Vue2），
       额外加载 Vue3 挂到 window.Vue3，供 Vue3 物料使用。
       Vue3 运行时已本地化为 /vendor/vue@3.js（来源 vue3-widget-lib node_modules），
       离线/内网环境可用，先加载 Vue3 再由 webpack 注入 Vue2，互不冲突（Vue2 走模块 import，不依赖 window.Vue）。 -->
  <script src="/vendor/vue@3.js"></script>
  <!-- element-plus 全量 UMD：Vue3 物料构建时把 'element-plus' 设为 external，
       运行时从 window.ElementPlus 取组件。UMD 读取 window.Vue 作为 Vue3 运行时，
       必须在 vue@3.js 之后、清除 window.Vue 之前加载。 -->
  <script src="/vendor/element-plus.js"></script>
  <link rel="stylesheet" href="/vendor/element-plus.css">
  <script>
    // vue@3.js 的 UMD 全局构建以 var Vue = ... 声明，会污染 window.Vue（指向 Vue3）。
    // 若保留，element-ui.common.js 在模块加载时会检测到 window.Vue 存在并自动
    // install 到 Vue3，而 Vue3 没有 Vue.component 静态方法，导致报错。
    // 基座自身 Vue2 走 webpack 模块 import，不依赖 window.Vue；物料通过
    // window.Vue3 / window.Vue2 取各自运行时。故此处先保存 Vue3 引用再清除 window.Vue。
    window.Vue3 = window.Vue;
    delete window.Vue;
  </script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
