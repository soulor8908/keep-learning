<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue3 Widget 预览</title>
  <!-- Vue3 运行时，UMD 产物要求全局为 window.Vue3 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.js"></script>
  <script>
    if (typeof window !== 'undefined' && window.Vue && !window.Vue3) {
      window.Vue3 = window.Vue;
    }
  </script>
  <!-- ElementPlus 样式与组件库 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.7.0/dist/index.css">
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.7.0/dist/index.full.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main-dev.js"></script>
</body>
</html>
