<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue2 Widget 预览</title>
  <!-- Vue2 运行时，UMD 产物要求全局为 window.Vue2 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
  <script>
    if (typeof window !== 'undefined' && window.Vue && !window.Vue2) {
      window.Vue2 = window.Vue;
    }
  </script>
  <!-- ElementUI 样式与组件库 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css">
  <script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/index.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main-dev.js"></script>
</body>
</html>
