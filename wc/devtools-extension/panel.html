<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-tab="widgets">物料列表</button>
      <button class="tab" data-tab="events">事件流</button>
      <button class="tab" data-tab="performance">性能</button>
    </div>
    <div class="actions">
      <button id="refresh-btn" title="刷新快照">刷新</button>
      <button id="clear-btn" title="清空事件">清空</button>
      <label class="auto-toggle"><input type="checkbox" id="auto-refresh" checked /> 自动刷新</label>
    </div>
  </div>

  <div class="status-bar" id="status-bar">未连接</div>

  <!-- Tab 1: 物料列表 -->
  <div class="tab-content active" id="tab-widgets">
    <div class="runtime-info" id="runtime-info"></div>
    <table class="widget-table">
      <thead>
        <tr>
          <th>物料名</th>
          <th>状态</th>
          <th>Props</th>
          <th>Scope Meta</th>
          <th>注册时间</th>
        </tr>
      </thead>
      <tbody id="widget-tbody">
        <tr><td colspan="5" class="empty">暂无数据</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Tab 2: 事件流 -->
  <div class="tab-content" id="tab-events">
    <div class="event-list" id="event-list">
      <div class="empty">暂无事件</div>
    </div>
  </div>

  <!-- Tab 3: 性能 -->
  <div class="tab-content" id="tab-performance">
    <div class="perf-stats" id="perf-stats"></div>
    <div class="timeline" id="timeline">
      <div class="empty">暂无生命周期事件</div>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
