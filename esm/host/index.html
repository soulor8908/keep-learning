<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BI 看板基座（ESM + importmap + UI 分组按需）</title>
    <!--
      UI 分组按需加载策略（对照旧版全量 importmap）：

      旧版：importmap 把 'element-plus' 映射到全量 esm.sh URL，任何物料 import 都拉全量。
      新版：把组件库按使用频次/类型分组，每组一个 canonical URL 放进 importmap 顶层 imports：
        - element-plus/common  → 高频通用（Button/Input/Tag/...）
        - element-plus/table   → 表格类（Table/TableColumn/Pagination）
        - element-plus/form    → 表单类（Select/Cascader/Switch/...）
        - element-plus/heavy   → 少用但大（DatePicker/Upload/...）
      物料只 import 用到的组，用到才加载；同组同 URL 浏览器自动去重（跨物料/跨基座）。

      importmap 由 vite.config.js 的 importmapInjectPlugin 从 esm/wc/ui-groups.json 自动生成，
      改分组只改那个 json 文件，本 html 的占位标记下方无需手改。

      离线/内网：启动时设 UI_CDN_BASE=http://内网静态服务器 即可把所有 esm.sh URL 换成自托管产物。
    -->

    <!-- UI 库全局样式：浏览器原生 ESM 不支持 import CSS，组件库 CSS 仍需 <link> 全局引入。
         element-plus 供基座 + Vue3 物料，element-ui 供 Vue2 物料。 -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.0/dist/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css" />

    <!--IMPORTMAP_INJECT-->
    <!-- importmap 由 vite 插件从 ui-groups.json 生成并注入此处；构建/启动后此处为 <script type="importmap"> -->
    <!--/IMPORTMAP_INJECT-->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
